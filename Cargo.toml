[package]
name = "horizon-no_chat_reports"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unsigned, unreportable chat: no chat session or public key leaves the client, relayed signatures are stripped on a hosted server, and the unsecure badges disappear. A Horizon native mod."
publish = false

# The runtime doubles as the mod's library (its tests) and the module the
# bundle injects into the game; the helper files compile only inside it.
[lib]
path = "mixins/no_chat_reports/runtime.rs"
