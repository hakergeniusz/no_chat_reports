[package]
name = "no_chat_reports"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Unsigned, unreportable chat: no chat session or public key leaves the client, relayed signatures are stripped on a hosted server, and the unsecure badges disappear. A Horizon native mod."
publish = false

[dependencies]
# The pinned SDK's API crate; the launcher stages its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
